name: 📦 Build iStoreOS Packages (SQM etc.)

on:
  workflow_dispatch:
    inputs:
      package_list:
        description: "要编译的包（空格分隔）"
        required: false
        default: "sqm-scripts luci-app-sqm luci-i18n-sqm-zh-cn"

env:
  VERSION: main  # iStoreOS 默认分支

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: ⏬ 安装依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libncurses5-dev zstd git python3 unzip gawk wget gettext

      - name: 📥 拉取 iStoreOS 源码
        run: |
          git clone https://github.com/istoreos/istoreos.git source
          cd source
          git checkout ${{ env.VERSION }}

      - name: 📡 更新 feeds
        working-directory: ./source
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: ⚙️ 生成 .config 并启用 SQM 包
        working-directory: ./source
        run: |
          # 设置目标设备
          echo "CONFIG_TARGET_armsr_armv8=y" > .config
          echo "CONFIG_TARGET_armsr_armv8_DEVICE_generic=y" >> .config
          
          # 启用 SQM 包
          echo "CONFIG_PACKAGE_sqm-scripts=y" >> .config
          echo "CONFIG_PACKAGE_luci-app-sqm=y" >> .config
          echo "CONFIG_PACKAGE_luci-i18n-sqm-zh-cn=y" >> .config
          
          # 生成默认配置
          make defconfig

      - name: 🧱 编译指定包
        working-directory: ./source
        run: |
          for pkg in ${{ inputs.package_list }}; do
            make package/$pkg/compile V=s -j$(nproc)
          done

      - name: 📦 打包编译结果
        run: |
          mkdir -p output
          find source/bin/packages/ -name "*.ipk" -exec cp {} output/ \;
          find source/bin/targets/ -name "*.ipk" -exec cp {} output/ \;
          ls -lh output

      - name: 🚀 上传到 Release
        uses: softprops/action-gh-release@v2.2.1
        with:
          tag_name: Packages-${{ env.VERSION }}
          files: output/*.ipk
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
